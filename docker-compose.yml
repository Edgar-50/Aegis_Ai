services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
    ports: ["5432:5432"]
    volumes: ["aegis_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["aegis_redis:/data"]

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command: ["redpanda","start","--overprovisioned","--smp=1","--memory=512M","--reserve-memory=0M","--node-id=0","--check=false","--kafka-addr=0.0.0.0:9092","--advertise-kafka-addr=redpanda:9092"]
    ports: ["9092:9092"]
    volumes: ["aegis_redpanda:/var/lib/redpanda/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegisadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aegis-minio-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: ["aegis_evidence:/data"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegis-graph-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes: ["aegis_graph:/data"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      AEGIS_ENV: ${AEGIS_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis_dev}@db:5432/aegis
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_ENABLED: "true"
      EVIDENCE_BACKEND: ${EVIDENCE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aegisadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aegis-minio-change-me}
      S3_BUCKET: ${S3_BUCKET:-aegis-evidence}
      AUDIT_LOG_PATH: /data/audit/audit.jsonl
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aegis-graph-change-me}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - aegis_audit:/data/audit
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      redpanda: {condition: service_started}
      minio: {condition: service_started}
      neo4j: {condition: service_started}
      jaeger: {condition: service_started}
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  aegis_pg:
  aegis_redis:
  aegis_redpanda:
  aegis_evidence:
  aegis_audit:
  aegis_graph:
